<!DOCTYPE html>
<html>
<body style="text-align: center;">

    <h2>USER LOGIN</h2>

    <form>
        <table align="center" border="10" cellspacing="10" cellpadding="10">

            <tr>
                <td><label for="usname">Username:</label></td>
                <td><input type="text" id="usname"></td>
            </tr>

            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" id="password"></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
