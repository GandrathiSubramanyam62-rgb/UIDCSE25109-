<!DOCTYPE html>
<html>
    <title>college registration form</title>
    <body style="background-color: rgb(0, 0, 0); text-align: center;color: gold;">
         <h2 style="color: gold; text-align: center;font-style: italic;">G.SUBRAMANYAM CSE 25109</h2>
        <h2 style="color: gold; text-align: center;font-style: italic;"> COLLEGE ADMISSION REGISTRATION</h2>
        <form>
            <table border="10" cellspacing="0%" cellpadding="18" align="center" border-collapse="collapse">
                <tr>
                    <td>
                        <label for="name"> FULL NAME</label>
                    </td>
                    <td> <input type="text" id="name"></td>
                </tr>
                <tr>
                    <td>
                        <label for="email"> EMAIL</label>
                    </td>
                    <td> <input type="email" id="email"></td>
                </tr>
                <tr>
                    <td>
                        <label for=" phone number">PHONE NUMBER</label>
                    </td>
                    <td> <input type="text"></td>
                </tr>
                <tr></tr>
                 <td>
                        <label for="gender">GENDER</label>
                    </td>
                    <td> <input type="radio" id="gender">male
                         <input type="radio" id="gender">female
                    </td>
                    </tr>
                    <tr>
                     <td>
                        <label for="course">COURSE APPLYING FOR</label>
                    </td>
                    <td> <select  id="COURSE APPLYING FOR">
                        <option value="BTECH">BTECH</option>
                        <option VALUE="MTECH"> MTECH</option>
                        <option value="MBA"> MBA</option>
                        <option value="PG">PG</option>
                    </td>
                    </tr>
                    <tr>
                     <td>
                        <label for="hobbies">HOBBIES </label>
                    </td>
                    <td> <input type="checkbox" id="hobbies"> playing
                        <input type="checkbox" id="hobbies"> singing
                         <input type="checkbox" id="hobbies"> dancing
                    </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="bir">DATE OF BIRTH</label>
                        </td>
                        <td>
                            <input type="date"ID="bir">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="upload certificates"> UPLOAD CERTIFICATES</label>
                        </td>
                        <td>
                            <input type="file"id="upload certificates">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="add">ADDRESS</label>
                        </td>
                        <td>
                            <textarea rowspan="10" colspan="10"></textarea>
                            </td>
                    </tr>
                    <tr>
                     <td colspan="2" align="center">
                        <input type="submit" value="login"></input>
                    </td>
                    </tr>
            </table>
        </form>
    </body>
