<!DOCTYPE html>
<html>
<body style="text-align: center;">

    <h2>USER LOGIN</h2>

    <form>
        <table align="center" border="30" cellspacing="10" cellpadding="10">

            <tr>
                <td><label for="usname">Username:</label></td>
                <td><input type="text" id="usname"></td>
            </tr>

            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" id="email"></td>
            </tr>

            <tr>
                <td>Phone:</td>
                <td><input type="tel"></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="submit" value="email">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
