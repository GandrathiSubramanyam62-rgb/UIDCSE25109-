<!DOCTYPE html>
<head>
    <title>Username Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            height: 100vh;
            margin: 0;
        }

        .header {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
        }

        .container {
            background: rgb(203, 235, 220);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(200, 58, 190, 0.2);
            text-align: center;
            width: 300px;
            margin: 100px auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            border: 2px solid #bddce9;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            border-color: #74ebd5;
            outline: none;
        }

        #message {
            margin-top: 10px;
            font-size: 14px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>
<body>

<div class="header">
    G. SUBRAMANYAM CSE25109
</div>

<div class="container">
    <h2>Enter Username</h2>
    <input type="text" id="username" placeholder="Enter username">
    <p id="message"></p>
</div>

<script>
    const usernameInput = document.getElementById("username");
    const message = document.getElementById("message");

    usernameInput.addEventListener("input", function() {
        let username = usernameInput.value;

        if (username.length === 0) {
            message.textContent = "";
        } 
        else if (username.length < 5) {
            message.textContent = "Username must be at least 5 characters";
            message.className = "error";
        } 
        else {
            message.textContent = "Username is valid";
            message.className = "success";
        }
    });
</script>

</body>
</html>
