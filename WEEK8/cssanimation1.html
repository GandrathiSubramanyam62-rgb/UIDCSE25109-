<!DOCTYPE html>
<html>
<head>
  <title>Rotating Square</title>
  <h2 style="color: rgb(105, 99, 68);"> G.SUBRAMANYAM CSE 25109</h2>
  <h3 style="color: blue;text-align: center;">CSS Animation Example: Rotating Square</h3>
  <style>
       body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgb(211, 200, 248);
        }
    .square {
      width: 100px;
      height: 100px;
      background-color: rgb(91, 46, 112);
      margin: 100px auto;
      animation: rotateSquare 4s linear infinite;
    }

    @keyframes rotateSquare {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

<div class="square"></div>
</body>
</html>
