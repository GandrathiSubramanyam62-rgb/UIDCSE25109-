<!DOCTYPE html>
<html>
<head>
  <title>Bouncing Ball </title>
  <h2 style="color: rgb(105, 99, 68);"> G.SUBRAMANYAM CSE 25109</h2>
  <style>
    body {
      text-align: center;
      margin-top: 50px;
       background-color: rgb(154, 202, 203);
    }
    .text::after {
      content: "K";
      font-size: 30px;
      font-weight: bold;
      animation: textBuild 2.4s steps(4) infinite;
    }

    @keyframes textBuild {
      0%   { content: "K"; }
      25%  { content: "KL"; }
      50%  { content: "KLR"; }
      75%  { content: "KLR1"; }
      100% { content: "K"; }
    }

    .ball {
      width: 80px;
      height: 80px;
      background-color: rgb(82, 118, 123);
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
      animation: bounce 0.6s ease-in-out infinite alternate;

    }
    @keyframes bounce {
      from {
        top: 0;
      }
      to {
        top: 120px;
      }
    }
  </style>
</head>
<body>
<div class="text"></div>
<div class="ball"></div>
</body>
</html>
