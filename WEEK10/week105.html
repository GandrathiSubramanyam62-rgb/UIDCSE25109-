<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #8B0000, #c8102e);
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        .header {
            position: absolute;
            top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: gold;
            letter-spacing: 1px;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            border: 2px solid gold;
        }

        h2 {
            margin-bottom: 20px;
            color: gold;
        }

        .inputs input {
            width: 80px;
            padding: 10px;
            margin: 5px;
            border-radius: 8px;
            border: none;
            text-align: center;
            background: #fff;
            color: #000;
            font-weight: bold;
        }

        .inputs input:focus {
            outline: none;
            box-shadow: 0 0 8px gold;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, gold, #ffcc00);
            color: #8B0000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.07);
            box-shadow: 0 0 15px gold;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            font-weight: bold;
        }

        .grade-A { color: #00ff88; }
        .grade-B { color: #00ccff; }
        .grade-C { color: #ffcc00; }
        .grade-D { color: #ff884d; }
        .grade-F { color: #ff3333; }
    </style>
</head>

<body>

    <div class="header">
        G.SUBRAMANYAM CSE25109
    </div>

    <div class="container">
        <h2>Student Grade Calculator</h2>

        <div class="inputs">
            <input type="number" id="m1" placeholder="S1">
            <input type="number" id="m2" placeholder="S2">
            <input type="number" id="m3" placeholder="S3"><br>
            <input type="number" id="m4" placeholder="S4">
            <input type="number" id="m5" placeholder="S5">
            <input type="number" id="m6" placeholder="S6">
        </div>

        <button onclick="calculateGrade()">Calculate</button>

        <div id="output">Enter marks and click Calculate</div>
    </div>

    <script>
        function calculateGrade() {
            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);
            let m4 = Number(document.getElementById("m4").value);
            let m5 = Number(document.getElementById("m5").value);
            let m6 = Number(document.getElementById("m6").value);

            let avg = (m1 + m2 + m3 + m4 + m5 + m6) / 6;
            let grade = "";
            let gradeClass = "";

            if (avg < 60) {
                grade = "F";
                gradeClass = "grade-F";
            } else if (avg < 70) {
                grade = "D";
                gradeClass = "grade-D";
            } else if (avg < 80) {
                grade = "C";
                gradeClass = "grade-C";
            } else if (avg < 90) {
                grade = "B";
                gradeClass = "grade-B";
            } else if (avg <= 100) {
                grade = "A";
                gradeClass = "grade-A";
            } else {
                grade = "Invalid";
            }

            document.getElementById("output").innerHTML =
                "Average: " + avg.toFixed(2) +
                "<br>Grade: <span class='" + gradeClass + "'>" + grade + "</span>";
        }
    </script>

</body>
</html>
