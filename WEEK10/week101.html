<!DOCTYPE html>
<html>
<head>
  <title>Sign of Product</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #001a3d, #002b5c);
      color: white;
      text-align: center;
    }

    .header {
      background: #0b1f3a;
      padding: 20px;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
      border-bottom: 4px solid #e31837;
    }

    .container {
      margin: 100px auto;
      width: 350px;
      padding: 30px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    h2 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    input {
      width: 85%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(45deg, #e31837, #ff4d6d);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #ff4d6d;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #ccc;
    }
  </style>

</head>
<body>

  <div class="header">
    G.SUBRAMANYAM CSE25109
  </div>

  <div class="container">
    <h2>Find Sign of Product</h2>

    <input type="number" id="num1" placeholder="Enter first number"><br>
    <input type="number" id="num2" placeholder="Enter second number"><br>
    <input type="number" id="num3" placeholder="Enter third number"><br>

    <button onclick="checkSign()">Check Sign</button>
  </div>

  <div class="footer">
   
  </div>

  <script>
    function checkSign() {
      let a = Number(document.getElementById("num1").value);
      let b = Number(document.getElementById("num2").value);
      let c = Number(document.getElementById("num3").value);

      let product = a * b * c;

      if (product > 0) {
        alert("The sign is plus");
      } else if (product < 0) {
        alert("The sign is minus");
      } else {
        alert("The sign is zero");
      }
    }
  </script>

</body>
</html>
